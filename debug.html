<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Trystero Debug</title>
<style>body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:14px;white-space:pre-wrap}</style></head>
<body><div id="log">starting…</div>
<script type="module">
const logEl = document.getElementById('log');
const lines = [];
function log(s){ lines.push(new Date().toISOString().slice(11,19)+' '+s); logEl.textContent = lines.join('\n'); document.title = lines[lines.length-1]; }
try {
  const STRAT = new URLSearchParams(location.search).get('s') || 'nostr';
  const MODURL = STRAT === 'torrent'
    ? 'https://cdn.jsdelivr.net/npm/@trystero-p2p/torrent@0.26.0/+esm'
    : 'https://cdn.jsdelivr.net/npm/@trystero-p2p/nostr@0.26.0/+esm';
  const nostr = await import(MODURL);
  log(STRAT + ' 0.26 module loaded, selfId=' + nostr.selfId);
  const RELAYS = undefined; // use 0.26 defaults first
  const RTC = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  ]};
  const room = nostr.joinRoom({ appId:'slime-slash-poc-v1', rtcConfig: RTC }, 'slime-world-1');
  const peers = new Set();
  // 0.26 API: onPeerJoin / onPeerLeave are assignable properties, not methods
  room.onPeerJoin = id => { peers.add(id); log('PEER JOIN ' + id + ' total=' + peers.size); };
  room.onPeerLeave = id => { peers.delete(id); log('PEER LEAVE ' + id + ' total=' + peers.size); };
  let sendPing = null;
  try {
    const act = room.makeAction('ping');
    if (Array.isArray(act)) { const [s, o] = act; sendPing = s; o((d, id) => log('NOSTR PING from ' + id + ': ' + d)); }
    else if (act && typeof act === 'object') { sendPing = act.send ? act.send.bind(act) : (typeof act === 'function' ? act : null); act.onReceive = (d, id) => log('PING from ' + id + ': ' + JSON.stringify(d)); }
    else if (typeof act === 'function') { sendPing = act; }
    log('makeAction shape: ' + (Array.isArray(act) ? 'tuple' : typeof act) + ' keys=' + (act && typeof act === 'object' ? Object.keys(act).join(',') : ''));
  } catch(e) { log('makeAction err: ' + e.message); }
  let n = 0;
  setInterval(() => {
    n++;
    try { if (sendPing) { const r = sendPing('hello ' + n); if (r && r.catch) r.catch(e=>log('ping send err ' + e.message)); } } catch(e) { log('ping send err ' + e.message); }
    let socks = 'n/a';
    try {
      const s = nostr.getRelaySockets ? nostr.getRelaySockets() : (nostr.getTrackers ? nostr.getTrackers() : null);
      socks = s ? (Array.isArray(s) ? s.join(' ') : Object.entries(s).map(([u, ws]) => u.replace('wss://','') + '=' + (ws.readyState !== undefined ? ws.readyState : '?')).join(' ')) : 'no socket api';
    } catch(e) { socks = 'err ' + e.message; }
    let pcInfo = 'none';
    try {
      const gp = room.getPeers();
      const entries = Object.entries(gp);
      pcInfo = entries.length ? entries.map(([id, pc]) => id.slice(0,6) + ':ice=' + (pc.iceConnectionState||'?') + '/sig=' + (pc.signalingState||'?')).join(' ') : 'none';
    } catch(e) { pcInfo = 'err ' + e.message; }
    log('t=' + n*5 + 's peers=' + peers.size + ' rtcPeers: ' + pcInfo + ' sockets: ' + socks);
  }, 5000);
} catch(e) {
  log('FATAL ' + e.message);
}
</script>
</body></html>
