<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Trystero Debug</title>
<style>body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:14px;white-space:pre-wrap}</style></head>
<body><div id="log">starting…</div>
<script type="module">
const logEl = document.getElementById('log');
const lines = [];
function log(s){ lines.push(new Date().toISOString().slice(11,19)+' '+s); logEl.textContent = lines.join('\n'); document.title = lines[lines.length-1]; }
try {
  const nostr = await import('https://cdn.jsdelivr.net/npm/trystero@0.21.6/nostr/+esm');
  log('nostr module loaded, selfId=' + nostr.selfId);
  const RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.primal.net','wss://purplepag.es','wss://relay.nostr.band','wss://nostr.wine','wss://relay.snort.social','wss://offchain.pub','wss://relay.current.fyi','wss://nostr.mom'];
  const room = nostr.joinRoom({ appId:'slime-slash-poc-v1', relayUrls: RELAYS }, 'slime-world-1');
  const peers = new Set();
  room.onPeerJoin(id => { peers.add(id); log('NOSTR PEER JOIN ' + id + ' total=' + peers.size); });
  room.onPeerLeave(id => { peers.delete(id); log('NOSTR PEER LEAVE ' + id + ' total=' + peers.size); });
  const [sendPing, onPing] = room.makeAction('ping');
  onPing((d, id) => log('NOSTR PING from ' + id + ': ' + d));
  let n = 0;
  setInterval(() => {
    n++;
    try { sendPing('hello ' + n); } catch(e) { log('ping send err ' + e.message); }
    let socks = 'n/a';
    try {
      const s = nostr.getRelaySockets();
      socks = Object.entries(s).map(([u, ws]) => u.replace('wss://','') + '=' + ws.readyState).join(' ');
    } catch(e) { socks = 'err ' + e.message; }
    log('t=' + n*5 + 's peers=' + peers.size + ' sockets: ' + socks);
  }, 5000);
} catch(e) {
  log('FATAL ' + e.message);
}
</script>
</body></html>
