  </defs>
  <!-- floating bubbles -->
  <circle cx="152" cy="18" r="7" fill="#ecd9ff" fill-opacity="0.85" stroke="#6f3fb8" stroke-width="2"/>
  <circle cx="168" cy="8" r="4" fill="#ecd9ff" fill-opacity="0.85" stroke="#6f3fb8" stroke-width="1.6"/>
  <!-- body: flat-bottomed jelly dome with a subtle top bump -->
  <path d="M16,152 C11,104 32,52 76,33 C87,28 93,21 100,21 C107,21 113,28 124,33 C168,52 189,104 184,152 C184,161 176,166 100,166 C24,166 16,161 16,152 Z"
