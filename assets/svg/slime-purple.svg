<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 176">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd9ff"/>
      <stop offset="0.55" stop-color="#c79bf5"/>
      <stop offset="1" stop-color="#9663e0"/>
